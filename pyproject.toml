[project]
name = "loan-approval-copilot"
version = "0.1.0"
description = "Loan Approval & Borrower Copilot"
authors = [
    {name = "rohith7869",email = "rbellapu@asu.edu"}
]
license = "Rohith Bellapu"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi (>=0.138.0,<0.139.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "uvicorn[standard] (>=0.49.0,<0.50.0)",
    "sqlalchemy (>=2.0.51,<3.0.0)",
    "alembic (>=1.18.5,<2.0.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "jupyter (>=1.1.1,<2.0.0)",
    "matplotlib (>=3.11.0,<4.0.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "numpy (>=2.5.1,<3.0.0)",
    "scipy (>=1.18.0,<2.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
packages = [{include = "app"}]

[tool.poetry.scripts]
start = "app.main:start"
train = "scripts.train:main"
ingest = "scripts.rag_ingest:main"
[dependency-groups]
dev = [
    "pre-commit (>=4.6.1,<5.0.0)",
    "black (>=26.5.1,<27.0.0)",
    "ruff (>=0.16.0,<0.17.0)",
    "isort (>=8.0.1,<9.0.0)"
]
